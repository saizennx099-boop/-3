<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>???</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#171a36;--dusk:#262c5e;--mist:#e9e6f5;--rose:#eaa3b7;--moon:#f6e7b4;
  --serif:"Young Serif",Georgia,serif;--sans:"Figtree",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,var(--dusk),var(--ink) 70%) fixed;
  color:var(--mist);font-family:var(--sans);line-height:1.7;overflow-x:hidden}
main{max-width:34rem;margin:0 auto;padding:10vh 1.5rem 12vh;text-align:center}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(3rem,13vw,5rem);line-height:1.05;color:var(--moon);margin-bottom:1.5rem}
.msg{font-size:1.1rem;max-width:28rem;margin:0 auto 2.5rem}
h2{font-family:var(--serif);font-weight:400;font-size:1.7rem;color:var(--moon);margin-bottom:1.5rem}
.row{position:relative;display:flex;justify-content:center;align-items:center;gap:1.25rem;flex-wrap:wrap;min-height:5rem}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;transition:transform .25s ease,font-size .25s ease,padding .25s ease}
button:focus-visible{outline:3px solid var(--moon);outline-offset:3px}
#yes{background:var(--rose);color:var(--ink);font-weight:500;font-size:1.05rem;padding:.85rem 1.8rem}
#no{background:transparent;color:var(--mist);border:1px solid rgba(233,230,245,.4);padding:.85rem 1.6rem;font-size:1rem}
#no.run{position:fixed;z-index:5}
#result{display:none}
#result.on{display:block;animation:rise 1s ease both}
#result img{width:min(100%,22rem);border-radius:1.25rem;display:block;margin:0 auto 1.5rem}
#result .fallback{font-size:6rem;margin-bottom:1rem}
#result p{font-family:var(--serif);font-size:1.5rem;color:var(--rose);line-height:1.4}
#ask.done{display:none}
#sound{display:none;position:fixed;top:1rem;right:1rem;z-index:6;width:3rem;height:3rem;padding:0;
  background:rgba(233,230,245,.15);color:var(--mist);font-size:1.3rem}
#sound.on{display:block}
#fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
@keyframes rise{from{opacity:0;transform:translateY(1rem)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fw" aria-hidden="true"></canvas>
<main>
  <h1 id="title"></h1>
  <p class="msg" id="msg"></p>

  <section id="ask">
    <h2 id="question"></h2>
    <div class="row">
      <button id="yes" type="button"></button>
      <button id="no" type="button"></button>
    </div>
  </section>

  <section id="result" aria-live="polite">
    <img id="gif" alt="Kedi öpücüğü">
    <div class="fallback" id="fallback" hidden>😽</div>
    <p id="final"></p>
  </section>
</main>
<button id="sound" type="button" aria-label="Sesi aç veya kapat">🔊</button>

<script>
/* ============ BURAYI KENDİNE GÖRE DEĞİŞTİR ============ */
const CONFIG = {
  title: "Özür dilerim.",
  message: "Seni kırdığım için gerçekten üzgünüm. Yanlış yaptım ve bunu biliyorum.",
  question: "Beni affeder misin?",
  yes: "Evet",
  no: "Hayır",
  gif: "kedi.gif",   // aynı klasöre koyduğun gif dosyası ya da doğrudan bir gif linki
  music: "muzik.mp3",  // aynı klasöre koyduğun ses dosyası ya da doğrudan mp3 linki
  volume: 0.6,         // 0 ile 1 arası
  ntfyTopic: "ozur-9eu72p4h50vl",   // bildirim konusu: ntfy uygulamasında bunu takip et, boş bırakırsan bildirim kapanır
  final: "Ben zaten affedeceğini biliyordum, cansın 💗"
};
/* ======================================================= */

const $ = id => document.getElementById(id);
$("title").textContent = CONFIG.title;
$("msg").textContent = CONFIG.message;
$("question").textContent = CONFIG.question;
$("yes").textContent = CONFIG.yes;
$("no").textContent = CONFIG.no;
$("final").textContent = CONFIG.final;

const yes = $("yes"), no = $("no");
let scale = 1, dodges = 0;

/* "Hayır" tıklanamaz: yaklaşınca kaçar, "Evet" büyür */
function dodge(e){
  e.preventDefault();
  e.stopPropagation();
  dodges++;
  scale = Math.min(scale + 0.3, 3.2);
  yes.style.fontSize = (1.05 * scale) + "rem";
  yes.style.padding = (0.85 * scale) + "rem " + (1.8 * scale) + "rem";
  no.classList.add("run");
  const w = no.offsetWidth, h = no.offsetHeight;
  no.style.left = Math.random() * (innerWidth - w - 20) + 10 + "px";
  no.style.top = Math.random() * (innerHeight - h - 20) + 10 + "px";
}
["mouseenter","pointerdown","touchstart","click","focus"].forEach(ev =>
  no.addEventListener(ev, dodge, {passive:false}));

/* Bildirim (ntfy.sh): açılınca ve "Evet"e basılınca telefonuna haber gelir */
function notify(text){
  if (!CONFIG.ntfyTopic) return;
  try {
    fetch("https://ntfy.sh/" + CONFIG.ntfyTopic, {method:"POST", body:text, mode:"no-cors", keepalive:true}).catch(() => {});
  } catch (e) {}
}
(function(){
  let seen = false;
  try { seen = sessionStorage.getItem("opened") === "1"; sessionStorage.setItem("opened", "1"); } catch (e) {}
  if (!seen) notify("Siteyi açtı 👀");
})();

/* "Evet" */
yes.addEventListener("click", () => {
  $("ask").classList.add("done");
  no.style.display = "none";
  const img = $("gif");
  img.onerror = () => { img.hidden = true; $("fallback").hidden = false; };
  img.src = CONFIG.gif;
  $("result").classList.add("on");
  notify("Affetti 💗 (Hayır butonundan " + dodges + " kez kaçtı)");
  try { fireworks(); } catch (e) { console.error(e); }
  try { startMusic(); } catch (e) { console.error(e); }
  $("result").scrollIntoView({behavior:"smooth", block:"center"});
});

/* Arka plan müziği: "Evet"e basılınca başlar.
   muzik.mp3 bulunamazsa yerleşik yumuşak bir melodi çalar. */
let audio, actx, synthTimer, synthOn = false, mode = "";
const SEQ = [261.63,329.63,392,329.63, 440,392,329.63,392, 293.66,349.23,440,349.23, 392,329.63,293.66,261.63];

function startSynth(){
  if (mode === "synth") return;
  mode = "synth";
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = actx || new AC();
  actx.resume();
  let step = 0, next = actx.currentTime + 0.1;
  synthOn = true;
  function note(f, t){
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "triangle"; o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.25 * CONFIG.volume, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.1);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + 1.2);
  }
  synthTimer = setInterval(() => {
    while (next < actx.currentTime + 0.6){
      note(SEQ[step % SEQ.length], next);
      if (step % 4 === 0) note(SEQ[step % SEQ.length] / 2, next);
      step++; next += 0.5;
    }
  }, 150);
  $("sound").classList.add("on");
}

function startMusic(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if (AC) { actx = new AC(); actx.resume(); }   // tıklama anında hazırla
  if (!CONFIG.music){ startSynth(); return; }
  audio = new Audio(CONFIG.music);
  audio.loop = true;
  audio.volume = CONFIG.volume;
  audio.addEventListener("error", startSynth);
  audio.play().then(() => { mode = "file"; $("sound").classList.add("on"); }).catch(startSynth);
}

$("sound").addEventListener("click", () => {
  const btn = $("sound");
  if (mode === "file"){
    if (audio.paused){ audio.play(); btn.textContent = "🔊"; }
    else { audio.pause(); btn.textContent = "🔇"; }
  } else if (mode === "synth"){
    if (actx.state === "running"){ actx.suspend(); btn.textContent = "🔇"; }
    else { actx.resume(); btn.textContent = "🔊"; }
  }
});

/* Havai fişek: "Evet"e basılınca yaklaşık 9 saniye patlar */
function fireworks(){
  const c = document.createElement("canvas");
  c.setAttribute("aria-hidden", "true");
  c.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3";
  document.body.appendChild(c);
  const ctx = c.getContext("2d");
  const size = () => { c.width = innerWidth; c.height = innerHeight; };
  size(); addEventListener("resize", size);

  const colors = ["#eaa3b7","#f6e7b4","#e9e6f5","#ff8fab","#ffd166","#9ad1ff"];
  const parts = [];
  function burst(x, y){
    const col = colors[Math.floor(Math.random() * colors.length)];
    for (let n = 0; n < 80; n++){
      const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 4.5;
      parts.push({x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, col});
    }
  }
  const end = performance.now() + 9000;
  let last = 0;
  burst(innerWidth / 2, innerHeight * 0.35);
  (function loop(t){
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = "rgba(0,0,0,.18)";
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.globalCompositeOperation = "lighter";
    if (t < end && t - last > 550){
      last = t;
      burst(innerWidth * (0.1 + Math.random() * 0.8), innerHeight * (0.1 + Math.random() * 0.45));
    }
    for (let i = parts.length - 1; i >= 0; i--){
      const q = parts[i];
      q.vy += 0.04; q.vx *= 0.985; q.vy *= 0.985;
      q.x += q.vx; q.y += q.vy; q.life -= 0.012;
      if (q.life <= 0){ parts.splice(i, 1); continue; }
      ctx.globalAlpha = q.life;
      ctx.fillStyle = q.col;
      ctx.beginPath(); ctx.arc(q.x, q.y, 2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (t < end || parts.length) requestAnimationFrame(loop);
    else { c.remove(); removeEventListener("resize", size); }
  })(performance.now());
}
</script>
</body>
</html>
