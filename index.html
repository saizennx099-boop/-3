<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Özür dilerim</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#171a36;--dusk:#262c5e;--mist:#e9e6f5;--rose:#eaa3b7;--moon:#f6e7b4;
  --serif:"Young Serif",Georgia,serif;--sans:"Figtree",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,var(--dusk),var(--ink) 70%) fixed;
  color:var(--mist);font-family:var(--sans);line-height:1.7;overflow-x:hidden}
main{max-width:34rem;margin:0 auto;padding:10vh 1.5rem 12vh;text-align:center}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(3rem,13vw,5rem);line-height:1.05;color:var(--moon);margin-bottom:1.5rem}
.msg{font-size:1.1rem;max-width:28rem;margin:0 auto 2.5rem}
h2{font-family:var(--serif);font-weight:400;font-size:1.7rem;color:var(--moon);margin-bottom:1.5rem}
.row{position:relative;display:flex;justify-content:center;align-items:center;gap:1.25rem;flex-wrap:wrap;min-height:5rem}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;transition:transform .25s ease,font-size .25s ease,padding .25s ease}
button:focus-visible{outline:3px solid var(--moon);outline-offset:3px}
#yes{background:var(--rose);color:var(--ink);font-weight:500;font-size:1.05rem;padding:.85rem 1.8rem}
#no{background:transparent;color:var(--mist);border:1px solid rgba(233,230,245,.4);padding:.85rem 1.6rem;font-size:1rem}
#no.run{position:fixed;z-index:5}
#result{display:none}
#result.on{display:block;animation:rise 1s ease both}
#result img{width:min(100%,22rem);border-radius:1.25rem;display:block;margin:0 auto 1.5rem}
#result .fallback{font-size:6rem;margin-bottom:1rem}
#result p{font-family:var(--serif);font-size:1.5rem;color:var(--rose);line-height:1.4}
#ask.done{display:none}
#sound{display:none;position:fixed;top:1rem;right:1rem;z-index:6;width:3rem;height:3rem;padding:0;
  background:rgba(233,230,245,.15);color:var(--mist);font-size:1.3rem}
#sound.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(1rem)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="msg" id="msg"></p>

  <section id="ask">
    <h2 id="question"></h2>
    <div class="row">
      <button id="yes" type="button"></button>
      <button id="no" type="button"></button>
    </div>
  </section>

  <section id="result" aria-live="polite">
    <img id="gif" alt="Kedi öpücüğü">
    <div class="fallback" id="fallback" hidden>😽</div>
    <p id="final"></p>
  </section>
</main>
<button id="sound" type="button" aria-label="Sesi aç veya kapat">🔊</button>

<script>
/* ============ BURAYI KENDİNE GÖRE DEĞİŞTİR ============ */
const CONFIG = {
  title: "Özür dilerim.",
  message: "Seni kırdığım için gerçekten üzgünüm. Yanlış yaptım ve bunu biliyorum.",
  question: "Beni affeder misin?",
  yes: "Evet",
  no: "Hayır",
  gif: "kedi.gif",   // aynı klasöre koyduğun gif dosyası ya da doğrudan bir gif linki
  music: "muzik.mp3",  // aynı klasöre koyduğun ses dosyası ya da doğrudan mp3 linki
  volume: 0.6,         // 0 ile 1 arası
  final: "Ben zaten affedeceğini biliyordum, cansın 💗"
};
/* ======================================================= */

const $ = id => document.getElementById(id);
$("title").textContent = CONFIG.title;
$("msg").textContent = CONFIG.message;
$("question").textContent = CONFIG.question;
$("yes").textContent = CONFIG.yes;
$("no").textContent = CONFIG.no;
$("final").textContent = CONFIG.final;

const yes = $("yes"), no = $("no");
let scale = 1;

/* "Hayır" tıklanamaz: yaklaşınca kaçar, "Evet" büyür */
function dodge(e){
  e.preventDefault();
  e.stopPropagation();
  scale = Math.min(scale + 0.3, 3.2);
  yes.style.fontSize = (1.05 * scale) + "rem";
  yes.style.padding = (0.85 * scale) + "rem " + (1.8 * scale) + "rem";
  no.classList.add("run");
  const w = no.offsetWidth, h = no.offsetHeight;
  no.style.left = Math.random() * (innerWidth - w - 20) + 10 + "px";
  no.style.top = Math.random() * (innerHeight - h - 20) + 10 + "px";
}
["mouseenter","pointerdown","touchstart","click","focus"].forEach(ev =>
  no.addEventListener(ev, dodge, {passive:false}));

/* "Evet" */
yes.addEventListener("click", () => {
  $("ask").classList.add("done");
  no.style.display = "none";
  const img = $("gif");
  img.onerror = () => { img.hidden = true; $("fallback").hidden = false; };
  img.src = CONFIG.gif;
  $("result").classList.add("on");
  startMusic();
  $("result").scrollIntoView({behavior:"smooth", block:"center"});
});

/* Arka plan müziği: "Evet"e basılınca başlar */
let audio;
function startMusic(){
  if (!CONFIG.music) return;
  audio = new Audio(CONFIG.music);
  audio.loop = true;
  audio.volume = CONFIG.volume;
  audio.play().then(() => $("sound").classList.add("on")).catch(() => {});
}
$("sound").addEventListener("click", () => {
  if (!audio) return;
  if (audio.paused){ audio.play(); $("sound").textContent = "🔊"; }
  else { audio.pause(); $("sound").textContent = "🔇"; }
});
</script>
</body>
</html>
